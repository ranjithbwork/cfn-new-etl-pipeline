AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Stack 1 of 2 - S3 buckets for the CFN-managed ETL pipeline (cfn-new prefix).
  Deployed before template-app.yaml so the buckets exist when the Lambda zip
  and Glue script are uploaded, and before the app stack references them.

Resources:
  PipelineInputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: cfn-new-pipeline-input
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: cfn-new-pipeline-output
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cfn-new-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

Outputs:
  InputBucketName:
    Value: !Ref PipelineInputBucket
    Export:
      Name: cfn-new-input-bucket-name
  OutputBucketName:
    Value: !Ref PipelineOutputBucket
    Export:
      Name: cfn-new-output-bucket-name
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: cfn-new-artifacts-bucket-name

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  New ETL Pipeline - S3 (input/output) -> Lambda trigger -> Glue Workflow
  (Crawler -> Job -> Crawler) -> Glue Data Catalog. Single CloudFormation
  stack for repeatable create/destroy.

Parameters:
  InputBucketName:
    Type: String
    Default: new-pipeline-input
  OutputBucketName:
    Type: String
    Default: new-pipeline-output
  GlueScriptKey:
    Type: String
    Default: scripts/glue_job.py
    Description: >
      S3 key (within the input bucket) where glue_job.py will be uploaded
      AFTER this stack is created. CloudFormation does not validate this
      file's existence at creation time - only the Glue job run itself
      needs it to be present.
  GlueDatabaseName:
    Type: String
    Default: new_catalog_db
  GlueJobName:
    Type: String
    Default: new-transform-job
  GlueInputCrawlerName:
    Type: String
    Default: new-input-crawler
  GlueOutputCrawlerName:
    Type: String
    Default: new-output-crawler
  GlueWorkflowName:
    Type: String
    Default: new-workflow
  LambdaFunctionName:
    Type: String
    Default: new-trigger-lambda

Resources:
  ############################################
  # S3 Buckets
  ############################################

  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${InputBucketName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${OutputBucketName}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ############################################
  # IAM Role - Glue Job
  ############################################

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: new-glue-job-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: new-glue-job-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBuckets
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${InputBucket}
                  - !Sub arn:aws:s3:::${OutputBucket}
              - Sid: ReadInputAndScripts
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${InputBucket}/input/*
                  - !Sub arn:aws:s3:::${InputBucket}/scripts/*
              - Sid: WriteOutput
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${OutputBucket}/output/*
              - Sid: WorkflowRunProperties
                Effect: Allow
                Action:
                  - glue:GetWorkflowRunProperties
                  - glue:GetWorkflowRun
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${GlueWorkflowName}

  ############################################
  # IAM Role - Glue Crawler
  ############################################

  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: new-glue-crawler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: new-glue-crawler-s3-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBuckets
                Effect: Allow
                Action: s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${InputBucket}
                  - !Sub arn:aws:s3:::${OutputBucket}
              - Sid: ReadInputAndOutput
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${InputBucket}/input/*
                  - !Sub arn:aws:s3:::${OutputBucket}/output/*

  ############################################
  # IAM Role - Lambda
  ############################################

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: new-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: new-lambda-glue-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartWorkflowOnly
                Effect: Allow
                Action: glue:StartWorkflowRun
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/${GlueWorkflowName}

  ############################################
  # Glue Data Catalog Database
  ############################################

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName

  ############################################
  # Glue ETL Job (Python Shell)
  ############################################

  GlueETLJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Ref GlueJobName
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub s3://${InputBucket}/${GlueScriptKey}
      MaxCapacity: 0.0625
      Timeout: 10
      MaxRetries: 0
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1

  ############################################
  # Glue Crawlers
  ############################################

  GlueInputCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: GlueDatabase
    Properties:
      Name: !Ref GlueInputCrawlerName
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub s3://${InputBucket}/input/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  GlueOutputCrawler:
    Type: AWS::Glue::Crawler
    DependsOn: GlueDatabase
    Properties:
      Name: !Ref GlueOutputCrawlerName
      Role: !GetAtt GlueCrawlerRole.Arn
      DatabaseName: !Ref GlueDatabaseName
      Targets:
        S3Targets:
          - Path: !Sub s3://${OutputBucket}/output/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  ############################################
  # Glue Workflow + Triggers
  ############################################

  GlueWorkflow:
    Type: AWS::Glue::Workflow
    Properties:
      Name: !Ref GlueWorkflowName
      Description: Orchestrates input-crawler -> transform-job -> output-crawler

  StartWorkflowTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: new-start-workflow-trigger
      Type: ON_DEMAND
      WorkflowName: !Ref GlueWorkflowName
      Actions:
        - CrawlerName: !Ref GlueInputCrawlerName
      StartOnCreation: false
    DependsOn:
      - GlueWorkflow
      - GlueInputCrawler

  AfterInputCrawlerTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: new-after-input-crawler-trigger
      Type: CONDITIONAL
      WorkflowName: !Ref GlueWorkflowName
      StartOnCreation: true
      Predicate:
        Logical: ANY
        Conditions:
          - LogicalOperator: EQUALS
            CrawlerName: !Ref GlueInputCrawlerName
            CrawlState: SUCCEEDED
      Actions:
        - JobName: !Ref GlueJobName
    DependsOn:
      - GlueWorkflow
      - GlueInputCrawler
      - GlueETLJob

  AfterJobTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: new-after-job-trigger
      Type: CONDITIONAL
      WorkflowName: !Ref GlueWorkflowName
      StartOnCreation: true
      Predicate:
        Logical: ANY
        Conditions:
          - LogicalOperator: EQUALS
            JobName: !Ref GlueJobName
            State: SUCCEEDED
      Actions:
        - CrawlerName: !Ref GlueOutputCrawlerName
    DependsOn:
      - GlueWorkflow
      - GlueETLJob
      - GlueOutputCrawler

  ############################################
  # Lambda Function (inline code - no S3 zip needed)
  ############################################

  TriggerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          GLUE_WORKFLOW_NAME: !Ref GlueWorkflowName
          OUTPUT_BUCKET_NAME: !Ref OutputBucket
      Code:
        ZipFile: !Sub |
          import boto3
          import os
          import urllib.parse

          glue = boto3.client('glue')

          GLUE_WORKFLOW_NAME = os.environ['GLUE_WORKFLOW_NAME']
          OUTPUT_BUCKET_NAME = os.environ['OUTPUT_BUCKET_NAME']


          def lambda_handler(event, context):
              print(f"Received event: {event}")

              record = event['Records'][0]
              bucket_name = record['s3']['bucket']['name']
              object_size = record['s3']['object'].get('size', 0)
              object_key = urllib.parse.unquote_plus(record['s3']['object']['key'])

              if not object_key.startswith('input/'):
                  print("Ignored: object is outside input/")
                  return {'statusCode': 200, 'message': 'Ignored object outside input/'}

              if not object_key.lower().endswith('.csv'):
                  print("Ignored: object is not a CSV file")
                  return {'statusCode': 200, 'message': 'Ignored non-CSV file'}

              if object_size == 0:
                  print("Ignored: CSV file is empty")
                  return {'statusCode': 200, 'message': 'Ignored empty CSV file'}

              input_path = f's3://{bucket_name}/{object_key}'
              file_name = object_key.split('/')[-1]
              base_name = file_name.rsplit('.', 1)[0]
              output_path = f's3://{OUTPUT_BUCKET_NAME}/output/{base_name}/'

              print(f"Starting Glue workflow: {GLUE_WORKFLOW_NAME}")

              response = glue.start_workflow_run(
                  Name=GLUE_WORKFLOW_NAME,
                  RunProperties={
                      'INPUT_PATH': input_path,
                      'OUTPUT_PATH': output_path
                  }
              )

              run_id = response['RunId']
              print(f"Started workflow run {run_id}")

              return {
                  'statusCode': 200,
                  'message': 'Glue workflow started successfully',
                  'runId': run_id,
                  'inputPath': input_path,
                  'outputPath': output_path
              }
    DependsOn:
      - GlueWorkflow

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TriggerLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${InputBucket}
      SourceAccount: !Ref AWS::AccountId

  ############################################
  # S3 -> Lambda Notification (Custom Resource)
  #
  # Applying NotificationConfiguration directly on the AWS::S3::Bucket
  # resource would create a circular dependency (bucket needs the Lambda
  # permission to exist first; the permission needs the bucket ARN). We
  # avoid this with a Lambda-backed custom resource that runs
  # put_bucket_notification_configuration AFTER both the bucket and the
  # Lambda permission already exist.
  ############################################

  NotificationConfigFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3NotificationConfigPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !Sub arn:aws:s3:::${InputBucket}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

  NotificationConfigFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt NotificationConfigFunctionRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client('s3')

          def handler(event, context):
              try:
                  props = event['ResourceProperties']
                  bucket = props['BucketName']
                  lambda_arn = props['LambdaArn']

                  if event['RequestType'] in ('Create', 'Update'):
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={
                              'LambdaFunctionConfigurations': [
                                  {
                                      'LambdaFunctionArn': lambda_arn,
                                      'Events': ['s3:ObjectCreated:*'],
                                      'Filter': {
                                          'Key': {
                                              'FilterRules': [
                                                  {'Name': 'prefix', 'Value': 'input/'},
                                                  {'Name': 'suffix', 'Value': '.csv'}
                                              ]
                                          }
                                      }
                                  }
                              ]
                          }
                      )
                  elif event['RequestType'] == 'Delete':
                      s3.put_bucket_notification_configuration(
                          Bucket=bucket,
                          NotificationConfiguration={}
                      )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  BucketNotificationConfig:
    Type: Custom::S3BucketNotification
    DependsOn:
      - LambdaInvokePermission
    Properties:
      ServiceToken: !GetAtt NotificationConfigFunction.Arn
      BucketName: !Ref InputBucket
      LambdaArn: !GetAtt TriggerLambda.Arn

Outputs:
  InputBucketNameOut:
    Value: !Ref InputBucket
  OutputBucketNameOut:
    Value: !Ref OutputBucket
  GlueJobNameOut:
    Value: !Ref GlueETLJob
  GlueWorkflowNameOut:
    Value: !Ref GlueWorkflow
  LambdaFunctionArnOut:
    Value: !GetAtt TriggerLambda.Arn
  GlueDatabaseNameOut:
    Value: !Ref GlueDatabaseName

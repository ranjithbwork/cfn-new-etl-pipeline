{
  "Version": "2012-10-17",
  "Statement":
    [
      {
        "Sid": "CloudFormationAccess",
        "Effect": "Allow",
        "Action":
          [
            "cloudformation:CreateStack",
            "cloudformation:UpdateStack",
            "cloudformation:DeleteStack",
            "cloudformation:DescribeStacks",
            "cloudformation:DescribeStackEvents",
            "cloudformation:DescribeStackResources",
            "cloudformation:GetTemplate",
            "cloudformation:ValidateTemplate",
            "cloudformation:ListStackResources",
            "cloudformation:CreateChangeSet",
            "cloudformation:DescribeChangeSet",
            "cloudformation:ExecuteChangeSet",
            "cloudformation:DeleteChangeSet",
            "cloudformation:ListChangeSets",
          ],
        "Resource": "arn:aws:cloudformation:ap-southeast-2:*:stack/cfn-new-etl-pipeline/*",
      },
      {
        "Sid": "S3BucketManagement",
        "Effect": "Allow",
        "Action":
          [
            "s3:CreateBucket",
            "s3:DeleteBucket",
            "s3:PutBucketPublicAccessBlock",
            "s3:PutEncryptionConfiguration",
            "s3:PutLifecycleConfiguration",
            "s3:PutBucketNotification",
            "s3:GetBucketNotification",
            "s3:ListBucket",
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:GetBucketLocation",
          ],
        "Resource":
          [
            "arn:aws:s3:::cfn-new-pipeline-input",
            "arn:aws:s3:::cfn-new-pipeline-input/*",
            "arn:aws:s3:::cfn-new-pipeline-output",
            "arn:aws:s3:::cfn-new-pipeline-output/*",
          ],
      },
      {
        "Sid": "IAMRoleManagement",
        "Effect": "Allow",
        "Action":
          [
            "iam:CreateRole",
            "iam:DeleteRole",
            "iam:GetRole",
            "iam:PassRole",
            "iam:AttachRolePolicy",
            "iam:DetachRolePolicy",
            "iam:PutRolePolicy",
            "iam:DeleteRolePolicy",
            "iam:GetRolePolicy",
            "iam:ListRolePolicies",
            "iam:ListAttachedRolePolicies",
            "iam:TagRole",
            "iam:UntagRole",
          ],
        "Resource": "arn:aws:iam::*:role/*",
      },
      {
        "Sid": "GlueManagement",
        "Effect": "Allow",
        "Action":
          [
            "glue:CreateDatabase",
            "glue:DeleteDatabase",
            "glue:GetDatabase",
            "glue:CreateJob",
            "glue:DeleteJob",
            "glue:GetJob",
            "glue:UpdateJob",
            "glue:CreateCrawler",
            "glue:DeleteCrawler",
            "glue:GetCrawler",
            "glue:UpdateCrawler",
            "glue:CreateWorkflow",
            "glue:DeleteWorkflow",
            "glue:GetWorkflow",
            "glue:CreateTrigger",
            "glue:DeleteTrigger",
            "glue:GetTrigger",
            "glue:UpdateTrigger",
            "glue:StartTrigger",
            "glue:TagResource",
            "glue:UntagResource",
          ],
        "Resource": "*",
      },
      {
        "Sid": "LambdaManagement",
        "Effect": "Allow",
        "Action":
          [
            "lambda:CreateFunction",
            "lambda:DeleteFunction",
            "lambda:GetFunction",
            "lambda:UpdateFunctionCode",
            "lambda:UpdateFunctionConfiguration",
            "lambda:AddPermission",
            "lambda:RemovePermission",
            "lambda:GetPolicy",
            "lambda:TagResource",
            "lambda:UntagResource",
            "lambda:InvokeFunction",
          ],
        "Resource": "arn:aws:lambda:ap-southeast-2:*:function:*",
      },
      {
        "Sid": "CloudWatchLogsForCustomResource",
        "Effect": "Allow",
        "Action":
          [
            "logs:CreateLogGroup",
            "logs:CreateLogStream",
            "logs:PutLogEvents",
            "logs:DeleteLogGroup",
          ],
        "Resource": "arn:aws:logs:ap-southeast-2:*:log-group:*",
      },
      {
        "Sid": "STSIdentity",
        "Effect": "Allow",
        "Action": "sts:GetCallerIdentity",
        "Resource": "*",
      },
    ],
}

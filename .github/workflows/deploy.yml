name: Deploy CFN ETL Pipeline

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: cfn-new-etl-pipeline
  TEMPLATE_FILE: cloudformation/cfn-new-etl-pipeline.yaml
  INPUT_BUCKET: cfn-new-pipeline-input

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Show stack failure events if deploy failed
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS'].[LogicalResourceId,ResourceStatusReason]" \
            --output table

      - name: Upload Glue script to input bucket
        run: |
          aws s3 cp glue/glue_job.py s3://${{ env.INPUT_BUCKET }}/scripts/glue_job.py

      - name: Upload sample CSV to trigger the pipeline
        run: |
          aws s3 cp sample-data/sample.csv s3://${{ env.INPUT_BUCKET }}/input/sample.csv

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs" \
            --output table

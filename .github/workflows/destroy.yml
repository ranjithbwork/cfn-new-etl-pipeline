name: Destroy CFN ETL Pipeline

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Empty pipeline input bucket
        run: |
          aws s3 rm s3://cfn-new-pipeline-input --recursive || true

      - name: Empty pipeline output bucket
        run: |
          aws s3 rm s3://cfn-new-pipeline-output --recursive || true

      - name: Empty artifacts bucket
        run: |
          aws s3 rm s3://cfn-new-artifacts-${{ steps.account.outputs.id }} --recursive || true

      - name: Delete CloudFormation stack
        run: |
          aws cloudformation delete-stack \
            --stack-name cfn-new-etl-pipeline \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for stack deletion to complete
        run: |
          aws cloudformation wait stack-delete-complete \
            --stack-name cfn-new-etl-pipeline \
            --region ${{ secrets.AWS_REGION }}

      - name: Confirm deletion
        run: |
          echo "Stack cfn-new-etl-pipeline deleted successfully."
